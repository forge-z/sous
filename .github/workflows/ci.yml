name: CI

on:
  push:
    branches: ["main", "feat/**", "perf/**"]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sous
          POSTGRES_PASSWORD: sous
          POSTGRES_DB: sous
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sous -d sous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sous:sous@localhost:5432/sous
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sous-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max