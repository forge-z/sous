name: Sous

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - ".github/workflows/sous.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/sous.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: sous:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
